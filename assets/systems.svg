<svg xmlns="http://www.w3.org/2000/svg" width="900" height="328" viewBox="0 0 900 328" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,monospace">
<defs><linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#1D9E75" stop-opacity="0.9"/>
  <stop offset="100%" stop-color="#1D9E75" stop-opacity="0.15"/>
</linearGradient></defs>
<style>
  .ui   { font-size: 11.5px; fill: #5f7d70; }
  .cmd  { font-size: 13px;   fill: #1D9E75; }
  .num  { font-size: 11.5px; fill: #4a6b5d; }
  .name { font-size: 13.5px; fill: #9FEFC9; font-weight: 700; }
  .desc { font-size: 12.5px; fill: #7d968b; }
  .meta { font-size: 12px;   fill: #1D9E75; }
  .tag  { font-size: 10px;   fill: #9FEFC9; font-weight: 700; letter-spacing: 0.6px; }
</style>

<rect x="1" y="1" width="898" height="326" rx="12" fill="#0D1117" stroke="url(#frame)" stroke-width="1.5"/>
