<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,monospace">
<defs>
  <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1D9E75" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#1D9E75" stop-opacity="0.12"/>
  </linearGradient>
  <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9FEFC9"/>
    <stop offset="60%" stop-color="#1D9E75"/>
    <stop offset="100%" stop-color="#0E6B4E"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .ui    { font-size: 11.5px; fill: #5f7d70; }
  .cmd   { font-size: 13px;   fill: #1D9E75; }
  .auth  { font-size: 12.5px; fill: #5f7d70; }
  .name  { font-size: 62px;   font-weight: 800; letter-spacing: 7px; }
  .role  { font-size: 13.5px; fill: #9FEFC9; letter-spacing: 2.2px; }
  .ok    { font-size: 12px;   fill: #1D9E75; font-weight: 700; }
  .stat  { font-size: 12.5px; fill: #8fa79b; }
</style>

<rect x="1" y="1" width="898" height="370" rx="14" fill="#0D1117" stroke="url(#frame)" stroke-width="1.5"/>
<line x1="1" y1="32" x2="899" y2="32" stroke="#1D9E75" stroke-opacity="0.18"/>
<circle cx="26" cy="17" r="5.5" fill="#ff5f56"/>
<circle cx="45" cy="17" r="5.5" fill="#ffbd2e"/>
<circle cx="64" cy="17" r="5.5" fill="#1D9E75"/>
<text x="86" y="21" class="ui">mortoti@nolaptech: ~</text>

<g clip-path="url(#t34_600)"><text xml:space="preserve" x="34" y="60" class="cmd">$ ssh mortoti@nolaptech.com</text></g>
<clipPath id="t34_600"><rect x="34" y="46" height="20" width="0">
  <animate attributeName="width" from="0" to="250" begin="0.2s" dur="0.8s" fill="freeze"/></rect></clipPath>
<g opacity="0"><text xml:space="preserve" x="34" y="82" class="auth">authentication successful. welcome back.</text>
  <animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.4s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="-12 0" to="0 0" begin="1.05s" dur="0.4s" fill="freeze"/></g>

<g filter="url(#soft)">
  <text x="450.0" y="168" text-anchor="middle" class="name" fill="none"
        stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="1600" stroke-dashoffset="1600">MORTOTI
    <animate attributeName="stroke-dashoffset" from="1600" to="0" begin="1.3s" dur="1.6s" fill="freeze"/>
    <animate attributeName="stroke-opacity" from="1" to="0" begin="2.7s" dur="0.7s" fill="freeze"/>
  </text>
  <text x="450.0" y="168" text-anchor="middle" class="name" fill="url(#nameGrad)" opacity="0">MORTOTI
    <animate attributeName="opacity" from="0" to="1" begin="2.35s" dur="0.9s" fill="freeze"/>
  </text>
</g>

<g opacity="0">
  <text x="450.0" y="199" text-anchor="middle" class="role">BACKEND DEVELOPER  ·  FOUNDER  ·  KUMASI, GHANA</text>
  <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.7s" fill="freeze"/>
</g>
<line x1="300.0" y1="221" x2="600.0" y2="221" stroke="#1D9E75" stroke-opacity="0" >
  <animate attributeName="stroke-opacity" from="0" to="0.25" begin="3.0s" dur="0.6s" fill="freeze"/>
</line>

<g opacity="0"><text xml:space="preserve" x="34" y="250" class="ok">[ ok ]</text>
  <text xml:space="preserve" x="92" y="250" class="stat">8 production systems online</text>
  <animate attributeName="opacity" from="0" to="1" begin="2.55s" dur="0.35s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="2.55s" dur="0.35s" fill="freeze"/></g>
<g opacity="0"><text xml:space="preserve" x="34" y="272" class="ok">[ ok ]</text>
  <text xml:space="preserve" x="92" y="272" class="stat">700+ active users served</text>
  <animate attributeName="opacity" from="0" to="1" begin="2.75s" dur="0.35s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="2.75s" dur="0.35s" fill="freeze"/></g>
<g opacity="0"><text xml:space="preserve" x="34" y="294" class="ok">[ ok ]</text>
  <text xml:space="preserve" x="92" y="294" class="stat">GHS 30,000 pitch funding secured</text>
  <animate attributeName="opacity" from="0" to="1" begin="2.95s" dur="0.35s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="2.95s" dur="0.35s" fill="freeze"/></g>
<g opacity="0"><text xml:space="preserve" x="34" y="316" class="ok">[ ok ]</text>
  <text xml:space="preserve" x="92" y="316" class="stat">first class, KNUST  ·  CWA 71.92</text>
  <animate attributeName="opacity" from="0" to="1" begin="3.15s" dur="0.35s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="-10 0" to="0 0" begin="3.15s" dur="0.35s" fill="freeze"/></g>

<g opacity="0">
  <text xml:space="preserve" x="34" y="352" class="cmd">$ </text>
  <animate attributeName="opacity" from="0" to="1" begin="3.45s" dur="0.3s" fill="freeze"/>
</g>
<rect x="50" y="341" width="8" height="13" fill="#1D9E75" opacity="0">
  <animate attributeName="opacity" values="0;1" begin="3.5s" dur="0.01s" fill="freeze"/>
  <animate attributeName="opacity" values="1;1;0;0;1" begin="3.6s" dur="1.1s" repeatCount="indefinite"/>
</rect>
</svg>
